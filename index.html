<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 자기주도학습 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1E7;
    --paper-raised:#EDEADC;
    --ink:#201E1A;
    --ink-soft:#4A463E;
    --indigo:#2C4A63;
    --indigo-soft:#3E6382;
    --brick:#A1402C;
    --line:#D8D3C4;
    --muted:#8B8577;
    --font-serif:'Noto Serif KR', serif;
    --font-sans:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B1A17;
      --paper-raised:#242320;
      --ink:#EDEADC;
      --ink-soft:#C9C4B4;
      --indigo:#7FA6C4;
      --indigo-soft:#9BBFD9;
      --brick:#D97D65;
      --line:#3A382F;
      --muted:#8B8577;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1A17;
    --paper-raised:#242320;
    --ink:#EDEADC;
    --ink-soft:#C9C4B4;
    --indigo:#7FA6C4;
    --indigo-soft:#9BBFD9;
    --brick:#D97D65;
    --line:#3A382F;
    --muted:#8B8577;
  }

  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
  }

  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding:40px 24px 80px;
  }

  .masthead{
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    margin-bottom:28px;
  }
  .masthead h1{
    cursor:pointer;
    font-family:var(--font-serif);
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead h1:hover{color:var(--indigo);}
  .masthead h1:focus-visible{outline:2px solid var(--indigo-soft); outline-offset:4px;}
  .masthead .eyebrow{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  .notice-line{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin:10px 0 24px;
  }

  /* 홈 메뉴 */
  .menu-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .menu-item{
    border-bottom:1px solid var(--line);
  }
  .menu-item:first-child{
    border-top:1px solid var(--line);
  }
  .menu-item button{
    width:100%;
    display:flex;
    align-items:center;
    gap:16px;
    background:none;
    border:none;
    text-align:left;
    padding:22px 4px;
    cursor:pointer;
    font-family:inherit;
    color:inherit;
  }
  .menu-item button:hover .menu-title,
  .menu-item button:focus-visible .menu-title{
    color:var(--indigo);
  }
  .menu-item button:focus-visible{
    outline:2px solid var(--indigo-soft);
    outline-offset:2px;
  }
  .menu-icon{
    flex:0 0 auto;
    width:34px;
    height:34px;
    color:var(--indigo);
  }
  .menu-icon svg{width:100%;height:100%;}
  .menu-text{flex:1 1 auto;}
  .menu-title{
    font-family:var(--font-serif);
    font-weight:700;
    font-size:18px;
    display:block;
    margin-bottom:4px;
    transition:color 0.15s ease;
  }
  .menu-desc{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .menu-arrow{
    flex:0 0 auto;
    color:var(--muted);
    font-size:18px;
  }

  /* 하위 화면 공통 */
  .screen{display:none;}
  .screen.active{
    display:block;
    animation:fadeIn 0.2s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .mode-nav{
    display:none;
    gap:8px;
    border-bottom:1px solid var(--line);
  }
  .mode-nav.visible{display:flex;}
  .mode-nav button{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:10px 4px 12px;
    color:var(--muted);
    font-family:var(--font-sans);
    font-size:12px;
    line-height:1.3;
    cursor:pointer;
  }
  .mode-nav button svg{width:20px;height:20px;}
  .mode-nav button:hover{color:var(--indigo);}
  .mode-nav button:focus-visible{outline:2px solid var(--indigo-soft); outline-offset:2px;}
  .mode-nav button.active{
    color:var(--indigo);
    border-bottom-color:var(--indigo);
    font-weight:500;
  }

  /* 질문·요청하기 */
  .ask-box{
    display:none;
    text-align:right;
    margin:10px 0 24px;
  }
  .ask-box.visible{display:block;}
  .ask-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-family:inherit;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px 0;
  }
  .ask-toggle:hover{color:var(--indigo);}
  .ask-form{
    display:none;
    text-align:left;
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px;
    background:var(--paper-raised);
  }
  .ask-form.open{display:block;}
  .ask-form textarea{
    width:100%;
    min-height:64px;
    resize:vertical;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    margin-bottom:8px;
  }
  .ask-form button{
    padding:8px 16px;
    background:var(--indigo);
    color:var(--paper);
    border:none;
    border-radius:2px;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
  }
  .ask-form button:hover{background:var(--indigo-soft);}

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  .search-row input{
    flex:1 1 auto;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--paper-raised);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
  }
  .search-row input:focus-visible{
    outline:2px solid var(--indigo-soft);
    outline-offset:1px;
  }
  .search-row button{
    padding:12px 18px;
    background:var(--indigo);
    color:var(--paper);
    border:none;
    border-radius:2px;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  .search-row button:hover{background:var(--indigo-soft);}
  .search-row button:focus-visible{outline:2px solid var(--brick); outline-offset:2px;}

  .result-box{
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .result-term{
    font-family:var(--font-serif);
    font-size:19px;
    font-weight:700;
    margin:0 0 10px;
  }
  .result-desc{
    font-size:15px;
    line-height:1.7;
    color:var(--ink);
  }
  .result-more{
    margin-top:12px;
    font-size:14px;
    color:var(--indigo);
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-family:inherit;
  }
  .result-more:hover{color:var(--brick);}
  .result-detail{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
    display:none;
  }
  .result-detail.open{display:block;}

  .empty-note{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }

  .candidate-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .candidate-btn{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    padding:12px 4px;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .candidate-term{
    font-size:15px;
    color:var(--ink);
  }
  .candidate-snippet{
    font-size:13px;
    color:var(--muted);
  }
  .candidate-btn:hover .candidate-term{color:var(--indigo);}
  .candidate-btn:focus-visible{outline:2px solid var(--indigo-soft); outline-offset:2px;}

  .placeholder-block{
    border:1px dashed var(--line);
    padding:20px;
    border-radius:2px;
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
  }

  .section-label{
    font-family:var(--font-serif);
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  .chain{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin:0 0 16px;
    font-size:14px;
  }
  .chain .node{
    padding:10px 14px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--ink);
  }
  .chain .arrow{color:var(--muted);}

  .accordion-item{
    border-bottom:1px solid var(--line);
  }
  .accordion-item:first-child{border-top:1px solid var(--line);}
  .accordion-head{
    width:100%;
    background:none;
    border:none;
    text-align:left;
    padding:16px 4px;
    font-family:var(--font-serif);
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .accordion-head:focus-visible{outline:2px solid var(--indigo-soft);}
  .accordion-body{
    display:none;
    padding:0 4px 16px;
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .accordion-body.open{display:block;}

  .q-item{
    margin:0 0 14px;
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .q-head{
    width:100%;
    background:var(--paper-raised);
    border:none;
    text-align:left;
    padding:12px 12px;
    font-family:var(--font-sans);
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .q-head:focus-visible{outline:2px solid var(--indigo-soft);}
  .q-explain{
    padding:12px;
    font-size:13px;
  }
  .q-unit-tag{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .tag-row{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tag-chip{
    font-size:12px;
    color:var(--indigo);
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:2px 10px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="masthead">
    <div class="eyebrow">한국사 자기주도학습 · © 담온 · 무단 전재·재배포를 금합니다</div>
    <h1 onclick="showScreen('home')" onkeydown="if(event.key==='Enter')showScreen('home')" tabindex="0" role="button" aria-label="메뉴로 돌아가기" title="메뉴로 돌아가기">한국사 챗봇</h1>
  </div>
  <p class="notice-line">담온 선생님이 제작한 DB를 기반으로 작동합니다. 오류나 추가 요청이 있으면 알려주세요. 최대한 반영하여 작업하겠습니다.</p>

  <div class="mode-nav" id="mode-nav">
    <button data-mode="dict" onclick="goToMode('dict')" aria-label="개념어 사전으로 이동">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h9a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M16 4h1a3 3 0 0 1 3 3v13h-4"/><line x1="8" y1="9" x2="12" y2="9"/></svg>
      개념어 사전
    </button>
    <button data-mode="causal" onclick="goToMode('causal')" aria-label="인과관계·심화로 이동">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.5 7.5 15.5 16.5"/></svg>
      인과관계·심화
    </button>
    <button data-mode="questions" onclick="goToMode('questions')" aria-label="어떤 질문이 있었을까로 이동">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 9a3 3 0 1 1 4 2.83c-.7.35-1 .9-1 1.67"/><line x1="12" y1="17" x2="12.01" y2="17"/><circle cx="12" cy="12" r="9.5"/></svg>
      어떤 질문이 있었을까?
    </button>
    <button data-mode="curiosity" onclick="goToMode('curiosity')" aria-label="궁금증 풀기로 이동">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v5"/><circle cx="12" cy="16.3" r="0.6" fill="currentColor" stroke="none"/></svg>
      궁금증 풀기
    </button>
  </div>

  <div class="ask-box" id="ask-box">
    <button class="ask-toggle" onclick="toggleAsk()">궁금한 점·요청 선생님께 전달하기</button>
    <div class="ask-form" id="ask-form">
      <textarea id="ask-text" placeholder="궁금한 점이나 선생님께 전달하고 싶은 내용을 적어주세요"></textarea>
      <button onclick="submitAsk()">보내기</button>
      <span id="ask-status" class="empty-note" style="margin-left:10px;"></span>
    </div>
  </div>

  <!-- 홈 메뉴 -->
  <div class="screen active" id="screen-home">
    <ul class="menu-list">
      <li class="menu-item">
        <button onclick="showScreen('dict')">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h9a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M16 4h1a3 3 0 0 1 3 3v13h-4"/><line x1="8" y1="9" x2="12" y2="9"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">개념어 사전</span>
            <span class="menu-desc">모르는 역사 개념어를 찾아 뜻을 확인합니다</span>
          </span>
          <span class="menu-arrow">›</span>
        </button>
      </li>
      <li class="menu-item">
        <button onclick="showScreen('causal')">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.5 7.5 15.5 16.5"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">인과관계·심화</span>
            <span class="menu-desc">배경 → 전개 → 결과의 흐름과 의미를 살펴봅니다</span>
          </span>
          <span class="menu-arrow">›</span>
        </button>
      </li>
      <li class="menu-item">
        <button onclick="showScreen('questions')">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 9a3 3 0 1 1 4 2.83c-.7.35-1 .9-1 1.67"/><line x1="12" y1="17" x2="12.01" y2="17"/><circle cx="12" cy="12" r="9.5"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">어떤 질문이 있었을까?</span>
            <span class="menu-desc">궁금한 개념어를 검색해 관련 예상 질문을 확인합니다</span>
          </span>
          <span class="menu-arrow">›</span>
        </button>
      </li>
      <li class="menu-item">
        <button onclick="showScreen('curiosity')">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v5"/><circle cx="12" cy="16.3" r="0.6" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">궁금증 풀기</span>
            <span class="menu-desc">개념어의 뜻부터 반전 질문까지, 단계별로 호기심을 따라갑니다</span>
          </span>
          <span class="menu-arrow">›</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- ① 개념어 사전 -->
  <div class="screen" id="screen-dict">
    <div class="search-row">
      <input id="dict-input" type="text" placeholder="개념어를 입력하세요" onkeydown="if(event.key==='Enter')searchDict()">
      <button onclick="searchDict()">검색</button>
    </div>
    <div id="dict-result"></div>
  </div>

  <!-- ② 인과관계·심화 -->
  <div class="screen" id="screen-causal">
    <div class="search-row">
      <input id="causal-input" type="text" placeholder="사건이나 제도를 입력하세요" onkeydown="if(event.key==='Enter')searchCausal()">
      <button onclick="searchCausal()">검색</button>
    </div>
    <div id="causal-result">
      <div class="placeholder-block">검색어를 입력하면 배경 → 전개 → 결과 구조가 이 자리에 표시됩니다.</div>
    </div>
  </div>

  <!-- ③ 어떤 질문이 있었을까? -->
  <div class="screen" id="screen-questions">
    <div class="search-row">
      <input id="questions-input" type="text" placeholder="개념어를 입력하세요" onkeydown="if(event.key==='Enter')searchQuestions()">
      <button onclick="searchQuestions()">검색</button>
    </div>
    <div id="questions-result">
      <div class="placeholder-block">개념어를 입력하면 관련된 예상 질문을 모아 보여드립니다.</div>
    </div>
  </div>

  <!-- ④ 궁금증 풀기 -->
  <div class="screen" id="screen-curiosity">
    <div class="search-row">
      <input id="curiosity-input" type="text" placeholder="개념어를 입력하세요" onkeydown="if(event.key==='Enter')searchCuriosity()">
      <button onclick="searchCuriosity()">검색</button>
    </div>
    <div id="curiosity-result">
      <div class="placeholder-block">개념어를 입력하면 "이건 뭐지?"부터 "왜 그럴까?"까지, 단계별 질문과 해설을 모아 보여드립니다.</div>
    </div>
  </div>

</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz7Oim9lT0i2bp5iAt7qDGNENXv1NRZi9hxznwCCUUbnfIV0wmFIUNqi4GoQ8_nV86xfQ/exec';
  const CLASS_ID = new URLSearchParams(location.search).get('class') || '';

  let jsonpCounter = 0;

  /** CORS 제약을 피하기 위해 <script> 태그로 요청하고 콜백으로 응답을 받는 방식 */
  function jsonpRequest(params){
    return new Promise((resolve, reject) => {
      const cbName = 'gasCb_' + (jsonpCounter++) + '_' + Date.now();
      const script = document.createElement('script');
      const timeout = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 8000);

      function cleanup(){
        clearTimeout(timeout);
        delete window[cbName];
        script.remove();
      }

      window[cbName] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('load error')); };

      const url = GAS_URL + '?' + new URLSearchParams({...params, classId: CLASS_ID, callback: cbName}).toString();
      script.src = url;
      document.body.appendChild(script);
    });
  }

  /** 일시적인 접속 오류를 완화하기 위해 실패 시 한 번만 자동 재시도 */
  async function callApi(params){
    try{
      return await jsonpRequest(params);
    }catch(err){
      await new Promise(r => setTimeout(r, 400));
      return await jsonpRequest(params);
    }
  }

  function renderScreen(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+name).classList.add('active');

    const nav = document.getElementById('mode-nav');
    const ask = document.getElementById('ask-box');
    if(name==='home'){
      nav.classList.remove('visible');
      ask.classList.remove('visible');
    }else{
      nav.classList.add('visible');
      ask.classList.add('visible');
    }
    nav.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('active', b.dataset.mode===name);
    });
  }

  function showScreen(name){
    renderScreen(name);
    history.pushState({screen:name}, '', '#'+name);
  }

  window.addEventListener('popstate', (e)=>{
    const name = (e.state && e.state.screen) || 'home';
    renderScreen(name);
  });
  history.replaceState({screen:'home'}, '', '#home');

  function goToMode(name){
    const isSameScreen = document.getElementById('screen-'+name).classList.contains('active');
    showScreen(name);
    if(isSameScreen){
      if(name==='dict') resetDict();
      if(name==='causal') resetCausal();
      if(name==='questions') resetQuestions();
      if(name==='curiosity') resetCuriosity();
    }
  }

  function toggleAsk(){
    document.getElementById('ask-form').classList.toggle('open');
  }

  async function submitAsk(){
    const text = document.getElementById('ask-text').value.trim();
    const status = document.getElementById('ask-status');
    if(!text) return;
    status.textContent = '보내는 중...';
    try{
      await callApi({action:'submitRequest', text});
      document.getElementById('ask-text').value = '';
      status.textContent = '선생님께 전달했습니다.';
    }catch(err){
      status.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해주세요.';
    }
  }

  /* ===================== ① 개념어 사전 ===================== */

  function renderDictEntry(entry){
    const box = document.getElementById('dict-result');
    if(entry.detail){
      box.innerHTML = `
        <div class="result-box">
          <p class="result-term">${entry.term}</p>
          <p class="result-desc">${entry.short}</p>
          <button class="result-more" onclick="this.nextElementSibling.classList.toggle('open')">더 자세히 보기 ▾</button>
          <div class="result-detail">${entry.detail}</div>
        </div>`;
    }else{
      box.innerHTML = `
        <div class="result-box">
          <p class="result-term">${entry.term}</p>
          <p class="result-desc">${entry.short}</p>
        </div>`;
    }
  }

  async function selectCandidate(term){
    const box = document.getElementById('dict-result');
    box.innerHTML = `<p class="empty-note">불러오는 중...</p>`;
    try{
      const entry = await callApi({action:'dictDetail', term});
      if(entry) renderDictEntry(entry);
      else box.innerHTML = `<div class="result-box"><p class="empty-note">아직 사전에 없는 개념이에요.<br>선생님께 전달했어요.</p></div>`;
    }catch(err){
      box.innerHTML = `<p class="empty-note">서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>`;
    }
  }

  async function searchDict(){
    const q = document.getElementById('dict-input').value.trim();
    const box = document.getElementById('dict-result');
    if(!q){ box.innerHTML=''; return; }

    box.innerHTML = `<p class="empty-note">검색 중... (설명된 내용이 많으면 시간이 조금 더 걸릴 수 있어요)</p>`;
    let res;
    try{
      res = await callApi({action:'dictLookup', q});
    }catch(err){
      box.innerHTML = `<p class="empty-note">서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>`;
      return;
    }

    if(res.candidates.length===0){
      box.innerHTML = `<div class="result-box"><p class="empty-note">아직 사전에 없는 개념이에요.<br>선생님께 전달했어요.</p></div>`;
      return;
    }
    if(res.single){
      renderDictEntry(res.single);
      return;
    }
    const items = res.candidates.map(c=>`
      <li>
        <button class="candidate-btn" onclick="selectCandidate('${c.term}')">
          <span class="candidate-term">${c.term}</span>
          <span class="candidate-snippet">${c.snippet}</span>
        </button>
      </li>`).join('');
    box.innerHTML = `
      <div class="result-box">
        <p class="empty-note" style="margin-bottom:10px;">"${q}" 검색 결과 ${res.candidates.length}건</p>
        <ul class="candidate-list">${items}</ul>
      </div>`;
  }

  function resetDict(){
    document.getElementById('dict-input').value = '';
    document.getElementById('dict-result').innerHTML = '';
    document.getElementById('dict-input').focus();
  }

  /* ===================== ② 인과관계·심화 ===================== */

  function renderCausalEntry(entry){
    const box = document.getElementById('causal-result');
    box.innerHTML = `
      <p class="result-term">${entry.term}</p>
      <p class="section-label">전개 과정 한눈에 보기</p>
      <div class="chain">
        <span class="node">${entry.bg}</span><span class="arrow">→</span>
        <span class="node">${entry.flow}</span><span class="arrow">→</span>
        <span class="node">${entry.result}</span>
      </div>
      <div class="result-detail open">
        <strong style="color:var(--ink); font-weight:500;">심화</strong> — ${entry.insight}<br><br>
        <strong style="color:var(--ink); font-weight:500;">비유</strong> — ${entry.analogy}
      </div>`;
  }

  async function selectCausalCandidate(term){
    const box = document.getElementById('causal-result');
    box.innerHTML = `<p class="empty-note">불러오는 중...</p>`;
    try{
      const entry = await callApi({action:'causalDetail', term});
      if(entry) renderCausalEntry(entry);
      else box.innerHTML = `<div class="result-box"><p class="empty-note">아직 이 개념의 인과관계 카드가 준비되지 않았습니다.</p></div>`;
    }catch(err){
      box.innerHTML = `<p class="empty-note">서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>`;
    }
  }

  async function searchCausal(){
    const q = document.getElementById('causal-input').value.trim();
    const box = document.getElementById('causal-result');
    if(!q){
      resetCausal();
      return;
    }
    box.innerHTML = `<p class="empty-note">검색 중... (설명된 내용이 많으면 시간이 조금 더 걸릴 수 있어요)</p>`;
    let res;
    try{
      res = await callApi({action:'causalLookup', q});
    }catch(err){
      box.innerHTML = `<p class="empty-note">서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>`;
      return;
    }

    if(res.candidates.length===0){
      box.innerHTML = `<div class="result-box"><p class="empty-note">아직 이 개념의 인과관계 카드가 준비되지 않았습니다.</p></div>`;
      return;
    }
    if(res.single){
      renderCausalEntry(res.single);
      return;
    }
    const items = res.candidates.map(c=>`
      <li>
        <button class="candidate-btn" onclick="selectCausalCandidate('${c.term}')">
          <span class="candidate-term">${c.term}</span>
          <span class="candidate-snippet">${c.snippet}</span>
        </button>
      </li>`).join('');
    box.innerHTML = `
      <p class="empty-note" style="margin-bottom:10px;">"${q}" 검색 결과 ${res.candidates.length}건</p>
      <ul class="candidate-list">${items}</ul>`;
  }

  function resetCausal(){
    document.getElementById('causal-input').value = '';
    document.getElementById('causal-result').innerHTML =
      `<div class="placeholder-block">검색어를 입력하면 배경 → 전개 → 결과 구조가 이 자리에 표시됩니다.</div>`;
    document.getElementById('causal-input').focus();
  }

  /* ===================== ③ 어떤 질문이 있었을까? ===================== */

  async function searchQuestions(){
    const q = document.getElementById('questions-input').value.trim();
    const box = document.getElementById('questions-result');
    if(!q){
      resetQuestions();
      return;
    }
    box.innerHTML = `<p class="empty-note">검색 중... (설명된 내용이 많으면 시간이 조금 더 걸릴 수 있어요)</p>`;
    let list;
    try{
      list = await callApi({action:'questionsByTerm', term:q});
    }catch(err){
      box.innerHTML = `<p class="empty-note">서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>`;
      return;
    }

    if(list.length===0){
      box.innerHTML = `<div class="result-box"><p class="empty-note">아직 이 개념에 대한 예상 질문이 없습니다.</p></div>`;
      return;
    }
    box.innerHTML = list.map((item, i) => `
      <div class="q-item">
        <button class="q-head" onclick="toggleAcc(this)">
          <span><span class="q-unit-tag">${item.unit}</span>${item.q}</span>
          <span>+</span>
        </button>
        <div class="accordion-body q-explain">
          ${item.explain}
          <div class="tag-row">${item.tags.map(t=>`<span class="tag-chip">${t}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');
  }

  function resetQuestions(){
    document.getElementById('questions-input').value = '';
    document.getElementById('questions-result').innerHTML =
      `<div class="placeholder-block">개념어를 입력하면 관련된 예상 질문을 모아 보여드립니다.</div>`;
    document.getElementById('questions-input').focus();
  }

  /* ===================== ④ 궁금증 풀기 ===================== */

  async function searchCuriosity(){
    const q = document.getElementById('curiosity-input').value.trim();
    const box = document.getElementById('curiosity-result');
    if(!q){
      resetCuriosity();
      return;
    }
    box.innerHTML = `<p class="empty-note">검색 중... (설명된 내용이 많으면 시간이 조금 더 걸릴 수 있어요)</p>`;
    let list;
    try{
      list = await callApi({action:'curiosityByTerm', term:q});
    }catch(err){
      box.innerHTML = `<p class="empty-note">서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.</p>`;
      return;
    }

    if(list.length===0){
      box.innerHTML = `<div class="result-box"><p class="empty-note">아직 이 개념에 대한 궁금증 풀이가 없습니다.</p></div>`;
      return;
    }
    box.innerHTML = list.map(item => `
      <div class="q-item">
        <button class="q-head" onclick="toggleAcc(this)">
          <span><span class="q-unit-tag">${item.stage} ${item.direction} · ${item.unit}</span>${item.q}</span>
          <span>+</span>
        </button>
        <div class="accordion-body q-explain">
          ${item.explain}
        </div>
      </div>
    `).join('');
  }

  function resetCuriosity(){
    document.getElementById('curiosity-input').value = '';
    document.getElementById('curiosity-result').innerHTML =
      `<div class="placeholder-block">개념어를 입력하면 "이건 뭐지?"부터 "왜 그럴까?"까지, 단계별 질문과 해설을 모아 보여드립니다.</div>`;
    document.getElementById('curiosity-input').focus();
  }

  function toggleAcc(btn){
    const body = btn.nextElementSibling;
    body.classList.toggle('open');
    btn.querySelector('span:last-child').textContent = body.classList.contains('open') ? '−' : '+';
  }
</script>
</body>
</html>
